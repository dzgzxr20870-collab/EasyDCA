# ⚠️ ไฟล์นี้ "ไม่มีผลแล้ว" ตั้งแต่ Railway เปลี่ยน Builder ของ Project นี้จาก
# Nixpacks → Railpack (ยืนยันจาก Build Log จริงของ easydca-worker: "using build
# driver railpack-v0.33.0") — Railpack ไม่อ่าน nixpacks.toml เลย คนละ Config กัน
# ทั้งหมด การเพิ่ม nixPkgs = ['...', 'postgresql'] ที่นี่ (Commit 4f823db,
# 2026-07-24) จึงไม่เคยมีผลจริงบน Deployment แม้ Diff จะดู Merge สำเร็จก็ตาม
#
# Fix ตัวจริงสำหรับ pg_dump (Nightly Backup, dbBackup.job.js) อยู่ที่
# backend/railpack.json (deploy.aptPackages) — เก็บไฟล์นี้ไว้เผื่อ Railway ย้อนกลับ
# ไปใช้ Nixpacks Builder อีกครั้งเท่านั้น ถ้าเจอ Error "pg_dump ... ENOENT" อีกใน
# อนาคต ให้เช็ค railpack.json ก่อน ไม่ใช่ไฟล์นี้
[phases.setup]
nixPkgs = ['...', 'postgresql']
